name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salary-radar-daily
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect + render
        run: |
          python3 main.py run

      - name: Verify schema/artifacts
        run: |
          test -f outputs/index.html
          test -f outputs/report.json

      - name: Commit fresh data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs data
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "auto-chore: refresh daily report"
            git push
          fi