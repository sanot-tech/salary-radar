name: activity

# ~100+ commits/day so the contribution graph stays full and green.
# Each run writes one unique tick file and commits it from the repo owner's
# noreply email (when "Keep my email private" is on, GitHub attributes these
# commits to the sanot-tech account, filling the green square for real).
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salary-radar-activity
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write tick
        run: |
          mkdir -p activity
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          printf 'tick %s run=%s\n' "$ts" "$GITHUB_RUN_ID" > "activity/tick-${ts}.txt"

      - name: Commit tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sanot-tech"
          git config user.email "224272286+sanot-tech@users.noreply.github.com"
          for i in 1 2 3; do
            git add activity
            if git diff --cached --quiet; then
              echo "Nothing changed — skip"
              exit 0
            fi
            git commit -m "auto-activity: daily tick $(date -u +%Y-%m-%d)"
            if git pull --rebase origin main && git push; then
              break
            fi
            sleep 5
          done